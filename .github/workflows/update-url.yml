name: Update FEMA URL

on:
  repository_dispatch:
    types: [fema_update]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          printf '%s\n' '${{ toJson(github.event.client_payload) }}' > latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update FEMA URL" || exit 0
          git push
